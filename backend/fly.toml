app = "prop-intel-backend-713"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "prop_intel_data"
  destination = "/app/data"

[env]
  PORT = "8080"
  DATABASE_URL = "/app/data/property_data.db"
